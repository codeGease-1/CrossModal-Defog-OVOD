# 正式训练配置。读取方式：
# python scripts/train/train_haze_density.py --config configs/haze_density.yaml
# 平铺字段与训练脚本 DEFAULT_CONFIG 一致，显式命令行选项优先。
# 不含未实现的 scheduler/depth/TensorBoard 配置。
dataset_root: datasets/RSHaze+
split_file: experiments/haze_density/rshazeplus_split.json
image_size: 256
batch_size: 4
num_workers: 2
pin_memory: true
base_channels: 32
use_sigmoid: true
epochs: 50
lr: 0.0001
amp: true
seed: 42
# 独立目录保留旧实验。训练不会覆盖已有的 best/latest。
checkpoint_dir: experiments/haze_density/checkpoints/spatial_v3
result_dir: experiments/haze_density/results/spatial_v3
window_size: 15
guided_radius: 15
guided_eps: 0.01
# 权重 0.5/0.3/0.2、指数 1.5、膨胀率 [2,3,4] 固定于代码。
# prior_version 由训练脚本自动记录。
