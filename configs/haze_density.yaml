# ============================================================================
# CrossModal-Defog-OVOD - 雾密度感知网络配置
# ============================================================================
# 注意：本配置文件中的参数分为两类：
#   1. 【申报书规定参数】- 来自《最终版申报书.pdf》3.2.1 节，不可修改
#   2. 【工程实现参数】- 为实现功能所需的工程参数，可根据实验调整
# ============================================================================

project:
  name: CrossModal-Defog-OVOD
  task: haze_density
  version: "1.0.0"

# ============================================================================
# 运行时配置（工程实现参数）
# ============================================================================
runtime:
  device: cuda              # 运行设备：cuda / cpu
  amp: true                 # 启用自动混合精度（AMP）
  seed: 42                  # 随机种子

# ============================================================================
# 数据配置（工程实现参数）
# ============================================================================
data:
  image_size: 256           # 输入图像尺寸 (H=W=256)
  batch_size: 4             # 批量大小（根据显存调整）
  num_workers: 2            # DataLoader 工作线程数
  pin_memory: true          # 启用 pinned memory 加速 GPU 传输

# ============================================================================
# 物理先验配置（申报书规定参数 - 不可修改）
# ============================================================================
physical_prior:
  # 加权融合权重
  weight_dark: 0.5          # Dark Channel 权重
  weight_contrast: 0.3      # Local Contrast 权重
  weight_color: 0.2         # Color Shift 权重

  # 非线性指数
  exponent_mu: 1.5          # 非线性变换指数 μ

  # Guided Filtering 参数（工程实现参数）
  guided_radius: 15         # 引导滤波半径 r
  guided_eps: 0.01          # 引导滤波正则化 ε

# ============================================================================
# 模型配置（部分申报书规定，部分工程实现）
# ============================================================================
model:
  # 基础通道数（工程实现参数）
  base_channels: 32         # Encoder 起始通道数

  # Encoder 深度（工程实现参数）
  encoder_depth: 4          # 下采样层数

  # Decoder 深度（工程实现参数）
  decoder_depth: 4          # 上采样层数

  # 多尺度 SDRB 膨胀率（申报书规定参数 - 不可修改）
  dilation_rates: [2, 3, 4] # 三个并行分支的 dilation rate

# ============================================================================
# 训练配置（工程实现参数）
# ============================================================================
train:
  # 优化器
  optimizer: Adam           # 优化器类型
  lr: 1e-4                  # 学习率
  weight_decay: 0.0         # 权重衰减

  # 训练轮数
  epochs: 100               # 总训练轮数

  # 学习率调度（工程实现参数）
  scheduler:
    enabled: true           # 是否启用学习率调度
    type: ReduceLROnPlateau # 调度器类型
    patience: 10            # 耐心值
    factor: 0.5             # 学习率衰减因子
    min_lr: 1e-6            # 最小学习率

  # Checkpoint
  save_every: 10            # 每 N 轮保存一次 checkpoint
  keep_last: 3              # 保留最近 N 个 checkpoint

  # 日志
  log_every: 50             # 每 N 步记录日志

# ============================================================================
# 损失函数配置（申报书规定参数）
# ============================================================================
loss:
  type: mse                 # 损失类型：MSE(I_h, S_final)

# ============================================================================
# 实验路径配置（工程实现参数）
# ============================================================================
paths:
  checkpoint_dir: experiments/haze_density/checkpoints
  log_dir: experiments/haze_density/logs
  output_dir: experiments/haze_density/output
