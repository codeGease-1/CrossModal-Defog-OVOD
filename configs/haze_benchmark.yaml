# All methods see the same stored float32 synthetic RGB and independently known t.
seed: 42
image_size: 256
domain: linear_srgb
uniform_t: [1.0, 0.9, 0.75, 0.6, 0.4]
airlights: [[1.0, 1.0, 1.0], [0.75, 0.8, 0.9]]
brightness: [1.0, 0.7]
spatial_patterns: [gradient, blob, regions]
methods: [dcp, prior, student]
checkpoint: null
prior:
  window_size: 15
  guided_radius: 15
  guided_eps: 0.01
region_grid: 4
tie_tolerance: 0.000001
# A diagnostic within each method; not a calibrated cross-method FPR threshold.
response_reference_threshold: 0.7
threads: 1
performance:
  sizes: [256, 512]
  batch_size: 1
  warmup: 3
  repeats: 20
  devices: [cpu, cuda]
  architecture_only_when_untrained: true
